name: build-lab3
on:
  push:
    paths: ["lab3/**", ".github/workflows/build.yml"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyinstaller
      - run: pyinstaller --onefile --windowed --name RasterLab lab3/main.py
      - uses: actions/upload-artifact@v4
        with:
          name: RasterLab-windows
          path: dist/RasterLab.exe
