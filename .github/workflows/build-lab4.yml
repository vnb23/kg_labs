name: build-lab4-exe
on:
  push:
    tags: ["lab4-*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install matplotlib pyinstaller
      - run: pyinstaller --onefile --name lab4 main.py
        working-directory: lab4
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            lab4/dist/lab4.exe
            lab4/segments.txt
            lab4/polygon.txt